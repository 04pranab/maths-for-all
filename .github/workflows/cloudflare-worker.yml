name: Cloudflare Worker checks

on:
  pull_request:
    paths:
      - "cloudflare/worker/**"
      - ".github/workflows/cloudflare-worker.yml"
  push:
    branches:
      - main
    paths:
      - "cloudflare/worker/**"
      - ".github/workflows/cloudflare-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-worker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Worker foundation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare/worker
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare/worker/package-lock.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run Worker tests
        run: npm test
