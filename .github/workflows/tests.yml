name: Tests

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
      - "test/**"
  pull_request:

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium

      - name: Syntax check
        run: |
          for file in js/*.js; do
            node --check "$file"
          done
          find server tests -name '*.mjs' -print0 | xargs -0 -n1 node --check

      - name: Browser stress test
        run: node tests/smoke.mjs

      - name: Production auth API checks
        run: node tests/auth-api.mjs

      - name: Production auth browser checks
        run: node tests/auth-browser.mjs
