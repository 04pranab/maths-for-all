name: Format

on:
  push:
    branches:
      - maintenance/status-docs-and-formatting

permissions:
  contents: write

concurrency:
  group: format-${{ github.ref }}
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout maintenance branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Format source and documentation
        run: npx --yes prettier@3.6.2 --write "**/*.{css,js,mjs,html,json,md,yml,yaml}"

      - name: Check whitespace errors
        run: git diff --check

      - name: Commit formatting changes
        run: |
          if git diff --quiet; then
            echo "All supported files are already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "style: format source and documentation"
          git push
